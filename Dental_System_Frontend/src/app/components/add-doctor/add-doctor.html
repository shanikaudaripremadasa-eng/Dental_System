<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-primary text-center">💡 Add New Doctor</h3>
        
        <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">
          
          
          <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" formControlName="fullName" class="form-control" placeholder="Dr. Perera">
            
            <div *ngIf="doctorForm.get('fullName')?.touched && doctorForm.get('fullName')?.invalid" class="text-danger small mt-1">
              Full name is required.
            </div>
          </div>

          
          <div class="mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" formControlName="email" class="form-control" placeholder="perera@gmail.com">
           
            <div *ngIf="doctorForm.get('email')?.touched && doctorForm.get('email')?.invalid" class="text-danger small mt-1">
              Please enter a valid email address.
            </div>
          </div>

          
          <div class="mb-3">
            <label class="form-label fw-bold">Temporary Password</label>
            <input type="password" formControlName="password" class="form-control" placeholder="******">
            
            <div *ngIf="doctorForm.get('password')?.touched && doctorForm.get('password')?.invalid" class="text-danger small mt-1">
              Password must be at least 6 characters.
            </div>
          </div>

          
          <div class="mb-3">
            <label class="form-label fw-bold">Specialization</label>
            <select formControlName="specialization" class="form-control">
              <option value="General">General Checkup</option>
              <option value="Orthodontist">Orthodontist</option>
              <option value="Cardiologist">Cardiologist</option>
              <option value="Pediatrician">Pediatrician</option>
            </select>
          </div>

          
          <div class="mb-3">
            <label class="form-label fw-bold">Phone Number</label>
            <input type="text" formControlName="phone" class="form-control" placeholder="071XXXXXXX">
          </div>

          
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary fw-bold">Register Doctor</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
