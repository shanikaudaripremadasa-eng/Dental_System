<div class="notification-container" style="padding: 20px; max-width: 800px; margin: auto;">
  <h2 style="margin-bottom: 20px;">Notifications</h2>
  
  <div *ngIf="!notifications || notifications.length === 0" style="text-align: center; color: #666;">
    No new notifications.
</div>
  
<div *ngFor="let n of notifications" 
     (click)="markAsRead(n._id)" 
     [style.opacity]="n.isRead ? '0.5' : '1'" 
     class="notification-card" 
     [style.border-left]="n.isRead ? '5px solid #ccc' : '5px solid #007bff'"
     style="background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;">
    
    <div style="display: flex; justify-content: space-between;">
      <strong>{{ n.type | uppercase }}</strong>
      <small style="color: #888;">{{ n.createdAt | date:'mediumDate' }}</small>
    </div>
    <p style="margin: 10px 0 0 0;">{{ n.message }}</p>
  </div>
</div>
