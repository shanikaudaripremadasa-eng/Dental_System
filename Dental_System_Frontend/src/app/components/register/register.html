<div class="login-wrapper">
  <div class="login-box">
    <h2>Create an Account</h2>
    <p>Please enter your details to register</p>
    
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="Enter your full name">
        <small *ngIf="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.errors?.['required']" class="error-text">
          Full name is required.
        </small>
        <small *ngIf="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.errors?.['minlength']" class="error-text">
          Name must be at least 3 characters long.
        </small>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['required']" class="error-text">
          Email address is required.
        </small>
        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="error-text">
          Please enter a valid email address.
        </small>
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Create a password">
        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']" class="error-text">
          Password is required.
        </small>
        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']" class="error-text">
          Password must be at least 6 characters long.
        </small>
      </div>
      
      <button type="submit" class="btn-login">Register</button>
    </form>
    
    <p class="bottom-text">Already have an account? <a href="/login">Login</a></p>
  </div>
</div>
